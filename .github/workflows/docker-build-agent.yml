name: Build Agent Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.agent'
      - 'agent-entrypoint.sh'
      - '.github/workflows/docker-build-agent.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and push agent image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/masterbot-agent:latest
            ghcr.io/${{ github.repository_owner }}/masterbot-agent:${{ github.sha }}
