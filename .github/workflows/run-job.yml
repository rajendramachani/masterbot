name: Run masterbot Agent

on:
  create:

jobs:
  run-agent:
    name: Run Pi coding agent on feat branch
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'feat/')
    permissions:
      contents: write
      packages: read

    steps:
      - name: Login to GHCR
        if: startsWith(vars.AGENT_IMAGE_URL, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run masterbot Agent
        env:
          AGENT_IMAGE_URL: ${{ vars.AGENT_IMAGE_URL }}
          MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          if [ -n "$AGENT_IMAGE_URL" ]; then
            IMAGE="${AGENT_IMAGE_URL}:latest"
          else
            IMAGE="stephengpope/thepopebot:latest"
          fi
          echo "Using image: $IMAGE"
          chmod +x agent-entrypoint.sh
          docker run --rm \
            -v "${{ github.workspace }}/agent-entrypoint.sh:/entrypoint.sh" \
            -e REPO_URL="${{ github.server_url }}/${{ github.repository }}.git" \
            -e BRANCH="${{ github.ref_name }}" \
            -e SECRETS='${{ secrets.SECRETS }}' \
            -e LLM_SECRETS='${{ secrets.LLM_SECRETS }}' \
            -e MODEL="${MODEL}" \
            "$IMAGE"
